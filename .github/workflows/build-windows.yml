name: Build Windows app

on:
  push:
    branches: ['main', 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every build gets a new version (major.minor from package.json, patch = run number)
      # so installed apps see it as an update.
      - name: Set build version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version "$base.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Build installer and publish release
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: MondiroMagicForge-Setup
          path: |
            dist/*.exe
            dist/latest.yml
