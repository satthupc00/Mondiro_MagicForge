name: Build Windows app

on:
  push:
    branches: ['main', 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every build gets a new version (major.minor from package.json, patch = run number)
      # so installed apps see it as an update.
      - name: Set build version
        id: ver
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          version="$base.${{ github.run_number }}"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build installer
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MondiroMagicForge-Setup
          path: |
            dist/*.exe
            dist/latest.yml
      # The installed app's auto-updater reads latest.yml from the newest release.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Mondiro MagicForge v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **MondiroMagicForge-Setup-${{ steps.ver.outputs.version }}.exe** and run it.
            Installed apps update themselves automatically.
          files: |
            dist/MondiroMagicForge-Setup-${{ steps.ver.outputs.version }}.exe
            dist/MondiroMagicForge-Setup-${{ steps.ver.outputs.version }}.exe.blockmap
            dist/latest.yml
